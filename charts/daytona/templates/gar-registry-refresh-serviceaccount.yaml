{{- $serviceAccount := .Values.garRegistryRefresh.serviceAccount | default dict -}}
{{- if and .Values.garRegistryRefresh.enabled ($serviceAccount.create | default true) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "daytona.garRegistryRefresh.serviceAccountName" . }}
  namespace: {{ include "daytona.namespace" . }}
  labels:
    {{- include "daytona.labels" . | nindent 4 }}
    app.kubernetes.io/component: gar-registry-refresh
  {{- if or .Values.garRegistryRefresh.googleServiceAccount $serviceAccount.annotations }}
  annotations:
    {{- if .Values.garRegistryRefresh.googleServiceAccount }}
    iam.gke.io/gcp-service-account: {{ .Values.garRegistryRefresh.googleServiceAccount | quote }}
    {{- end }}
    {{- with $serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
